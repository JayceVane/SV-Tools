name: CI

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: 完整回归（Node ${{ matrix.node }}）
    # 构建当前平台产物到 bin/，验证格式化与 JS 边界合同。
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 安装扩展构建与测试依赖
        run: npm ci

      - name: 安装 napi CLI
        run: npm ci --prefix src/native

      - name: 构建原生模块与 CLI 到 bin/
        run: node scripts/build-native.js

      - name: 运行完整回归测试
        run: npm test

      - name: 运行 Rust 测试
        run: cargo test --manifest-path src/native/Cargo.toml
