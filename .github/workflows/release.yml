name: Release 附件

# 原生模块与 vsix 不再进版本库（历史里的 23MB 对象是仓库膨胀的唯一来源），
# 改为随 tag 发布到 GitHub Releases 供下载与回溯。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  assets:
    name: 构建并上传 .node 与 vsix
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 校验 tag 与扩展版本一致
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.TAG !== "v" + require("./package.json").version) process.exit(1)'

      - name: 安装 napi CLI
        run: npm ci --prefix src/native

      - name: 构建原生模块
        run: node scripts/build-native.js

      - name: 打包 vsix（打包前自动跑完整测试）
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm ci
          npm run package -- --target win32-x64 --out "bin/svtools-$TAG-win32-x64.vsix"
        shell: bash

      - name: 验证公开安装包排除自用功能
        run: Get-ChildItem bin/*.vsix | ForEach-Object { node scripts/check-public-package.js $_.FullName; if ($LASTEXITCODE -ne 0) { throw '公开安装包检查失败' } }
        shell: pwsh

      - name: 运行 Rust 回归
        run: cargo test --manifest-path src/native/Cargo.toml

      - name: 生成 SHA256 校验清单
        run: |
          $files = Get-Item bin/*.vsix, bin/svtools.win32-x64-msvc.node, bin/svtools.exe
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content bin/SHA256SUMS.txt -Encoding ascii
        shell: pwsh

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            options=(--verify-tag --title "$TAG")
            if [[ "$TAG" == *-* ]]; then
              options+=(--prerelease --latest=false)
            fi
            if [[ -f "docs/releases/$TAG.md" ]]; then
              options+=(--notes-file "docs/releases/$TAG.md")
            else
              options+=(--generate-notes)
            fi
            gh release create "$TAG" "${options[@]}"
          fi
          gh release upload "$TAG" bin/svtools.win32-x64-msvc.node bin/svtools.exe bin/*.vsix bin/SHA256SUMS.txt
        shell: bash
