name: Release 发布

# 原生模块与 vsix 不再进版本库（历史里的 23MB 对象是仓库膨胀的唯一来源），
# 改为随 tag 发布到 GitHub Releases 供下载与回溯。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '补发到 Marketplace 的正式版本 tag（须与 master 当前版本一致）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  assets:
    if: github.event_name == 'push'
    name: 构建并上传 .node 与 vsix
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src/native/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 校验 tag 与扩展版本一致
        env:
          TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.TAG !== "v" + require("./package.json").version) process.exit(1)'

      - name: 安装 napi CLI
        run: npm ci --prefix src/native

      - name: 构建原生模块
        run: node scripts/build-native.js

      - name: 打包 vsix（打包前自动跑完整测试）
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm ci
          npm run package -- --target win32-x64 --out "bin/svtools-$TAG-win32-x64.vsix"
        shell: bash

      - name: 验证发行安装包与清单一致
        run: Get-ChildItem bin/*.vsix | ForEach-Object { node scripts/check-public-package.js $_.FullName; if ($LASTEXITCODE -ne 0) { throw '公开安装包检查失败' } }
        shell: pwsh

      - name: 运行 Rust 回归
        run: cargo test --manifest-path src/native/Cargo.toml

      - name: 生成 SHA256 校验清单
        run: |
          $files = Get-Item bin/*.vsix, bin/svtools.win32-x64-msvc.node, bin/svtools.exe
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content bin/SHA256SUMS.txt -Encoding ascii
        shell: pwsh

      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            options=(--verify-tag --title "$TAG")
            if [[ "$TAG" == *-* ]]; then
              options+=(--prerelease --latest=false)
            fi
            if [[ -f "docs/releases/$TAG.md" ]]; then
              options+=(--notes-file "docs/releases/$TAG.md")
            else
              options+=(--generate-notes)
            fi
            gh release create "$TAG" "${options[@]}"
          fi
          gh release upload "$TAG" bin/svtools.win32-x64-msvc.node bin/svtools.exe bin/*.vsix bin/SHA256SUMS.txt
        shell: bash

  marketplace:
    name: 发布到 VS Code Marketplace
    needs: assets
    if: >-
      always() && github.repository == 'JayceVane/SV-Tools' &&
      ((github.event_name == 'push' && needs.assets.result == 'success' && !contains(github.ref_name, '-')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: 确认正式发布版本
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e 'const t=process.env.RELEASE_TAG,p=require("./package.json");if(!/^v\d+\.\d+\.\d+$/.test(t)||t!=="v"+p.version)throw Error("tag与当前正式版本不一致");require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"tag="+t+"\n")'

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: .release-source

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装发布工具与发行资源依赖
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --prefix .release-source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:circuit --prefix .release-source

      - name: 获取并核验发行附件
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download $env:RELEASE_TAG --repo JayceVane/SV-Tools --pattern "svtools-${env:RELEASE_TAG}-win32-x64.vsix" --pattern SHA256SUMS.txt --dir bin/marketplace-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/prepare-marketplace.js $env:RELEASE_TAG .release-source bin/marketplace-release

      - name: 使用 Trusted Publishing 发布
        env:
          VSIX_PATH: ${{ steps.package.outputs.vsix }}
        run: node node_modules/@vscode/vsce/vsce publish --oidc --packagePath $env:VSIX_PATH --skip-duplicate

      - name: 复核 Marketplace 公开下载
        run: node scripts/verify-marketplace.js bin/marketplace-release/marketplace/publication.json

      - name: 保存发布包与校验记录
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-${{ steps.release.outputs.tag }}
          path: bin/marketplace-release/marketplace/*
          retention-days: 30
