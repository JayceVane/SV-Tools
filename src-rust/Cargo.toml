[package]
name = "svtools"
version = "3.3.0"
edition = "2021"
description = "SystemVerilog formatter and tools (VSCode extension + CLI)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "svtools"
path = "src/main.rs"

[dependencies]
napi = { version = "2", features = ["serde-json"] }
napi-derive = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tree-sitter = "0.25"
tree-sitter-systemverilog = "0.3"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
