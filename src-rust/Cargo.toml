[package]
name = "svtools"
version = "3.2.14"
edition = "2021"
description = "SystemVerilog formatter and tools native addon for VSCode"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["serde-json"] }
napi-derive = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
